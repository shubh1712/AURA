[pytest]
markers =
    live: Opt-in live tests that make real Gemini/Brave API calls (excluded by default)
    live_llm: Opt-in live tests that make real Gemini API calls (excluded by default)
    live_search: Opt-in live tests that make real Brave Search API calls (excluded by default)
    live_analysis: Opt-in live tests that execute end-to-end analysis with real Gemini and Brave APIs (excluded by default)
    live_vertex_smoke: Opt-in live smoke test verifying minimal Vertex AI Gemini connectivity (excluded by default)
    live_decomposition: Opt-in live benchmark verifying DecisionModel structured generation latency (excluded by default)
addopts = -m "not live_llm and not live_search and not live_analysis and not live_vertex_smoke and not live_decomposition"
testpaths = tests
